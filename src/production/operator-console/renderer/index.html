<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Sky Command</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; --bg: #0b0f12; --panel: #131c20; --panel-strong: #10181c; --line: #2e3c42; --text: #e8f0ef; --muted: #839397; --accent: #d7f16a; --danger: #ff9d9d; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
    body > header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
    header h1 { margin: 0; font-size: 14px; letter-spacing: 0.12em; }
    nav { display: flex; gap: 8px; }
    nav button, .row button, .actions button, .flight-controls button { background: #0d1519; color: var(--text); border: 1px solid #405057; min-height: 32px; padding: 0 12px; cursor: pointer; }
    nav button.active, .device.inspected { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #stream-ready.ok, #stream-label.ok { color: var(--accent); }
    main { display: none; flex: 1; min-height: 0; }
    main.active { display: grid; }
    #workspace-devices { grid-template-columns: 280px 1fr; }
    #workspace-routes { grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: minmax(0, 1fr); overflow: hidden; }
    #workspace-flight {
      grid-template-columns: minmax(0, 1fr) minmax(390px, 460px);
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
    }
    #workspace-flight .flight-video {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 16px;
      border-right: 1px solid var(--line);
      overflow: hidden;
    }
    .flight-video-stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 280px;
      display: flex;
      flex-direction: column;
    }
    .flight-hud {
      display: grid;
      grid-template-columns: repeat(6, minmax(4.8em, 1fr));
      gap: 8px;
      flex: 0 0 52px;
      margin: 0 0 8px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      background: #0d1418;
    }
    .flight-hud span { display: grid; gap: 2px; min-width: 0; }
    .flight-hud small { color: var(--muted); font-size: 10px; letter-spacing: 0.04em; }
    .flight-hud strong {
      color: var(--text);
      font: 12px/1.2 monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #workspace-flight video {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      background: #000;
      display: block;
      object-fit: contain;
    }
    #stream-label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    #workspace-flight .flight-controls {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-height: 0;
      overflow: hidden;
      padding: 0;
      background: var(--panel-strong);
    }
    section { padding: 16px; border-right: 1px solid var(--line); overflow: auto; }
    section:last-child { border-right: 0; }
    h2 { margin: 0 0 12px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .section-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .section-heading h2 { margin-bottom: 12px; }
    .section-heading button { margin-bottom: 12px; }
    .device { padding: 12px; margin-bottom: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
    .device strong { word-break: break-all; }
    .muted, .notice, .guide { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .chain { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
    .connection-status-list { display: grid; margin: 12px 0; border-top: 1px solid var(--line); }
    .connection-status-row { display: grid; grid-template-columns: minmax(96px, 132px) minmax(0, 1fr); gap: 16px; align-items: baseline; min-height: 34px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .connection-status-name { color: var(--muted); font-size: 12px; }
    .connection-status-value { min-width: 0; color: var(--text); font-size: 13px; overflow-wrap: anywhere; }
    .device-status-heading { margin: 20px 0 0; color: var(--accent); font-size: 12px; letter-spacing: 0; }
    .ok { color: var(--accent); }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .warn { color: #fc6; }
    #confirm[hidden], #mission-confirm[hidden] { display: none; }
    #connection-count.online { color: var(--accent); }
    #workspace-routes > .route-preview-panel { padding: 0; overflow: hidden; border-right: 1px solid #263138; min-height: 0; height: 100%; }
    #workspace-routes > .route-mission-wrap { padding: 16px; overflow: auto; min-height: 0; }
    .route-preview-panel { height: 100%; min-height: 0; display: grid; grid-template-rows: 72px minmax(0, 1fr) 36px; background: #11181c; }
    .route-preview-panel > header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #263138; }
    .route-preview-panel > header div { margin-right: 6px; }
    .route-preview-panel > header span { display: block; font-size: 9px; color: #89979b; letter-spacing: 1.5px; }
    .route-preview-panel > header h2 { margin: 4px 0 0; font-size: 17px; letter-spacing: .3px; text-transform: none; color: var(--text); }
    .route-preview-panel > header p { flex: 1; margin: 0; color: #9aa7aa; font: 10px monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .route-preview-panel > header button { border: 1px solid #334149; background: #0b0f12; color: #d7f16a; padding: 7px 10px; cursor: pointer; min-height: 0; }
    .route-preview-panel > header button:disabled { opacity: .5; cursor: wait; }
    .cesium-host { min-height: 0; height: 100%; background: #182228; position: relative; overflow: hidden; }
    .cesium-host .cesium-viewer, .cesium-host .cesium-viewer-cesiumWidget, .cesium-host .cesium-widget { position: absolute; inset: 0; width: 100%; height: 100%; }
    .cesium-host canvas { display: block; width: 100% !important; height: 100% !important; }
    .cesium-host .cesium-viewer-bottom { display: none; }
    .route-preview-panel .notice { margin: 0; padding: 10px 18px; color: #a8b3b6; font: 10px monospace; }
    .route-mission-control { padding: 16px; border: 1px solid #34434a; background: #11191d; }
    .route-mission-control .eyebrow { font-size: 9px; color: #89979b; letter-spacing: 1.5px; display: block; margin-bottom: 6px; }
    .route-picker { display: grid; gap: 6px; margin-top: 12px; }
    .route-picker[hidden], .route-details[hidden], #route-empty[hidden] { display: none !important; }
    .route-picker span { color: #839397; font: 9px monospace; letter-spacing: 1px; }
    .route-picker select { width: 100%; min-height: 34px; border: 1px solid #405057; background: #0a1013; color: #e7eeee; padding: 0 8px; font: 12px monospace; }
    .route-details { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 12px; }
    .route-details strong { display: block; color: #eff6f5; font-size: 13px; overflow-wrap: anywhere; }
    .route-details small { display: block; margin-top: 5px; color: #8a999d; font: 9px monospace; }
    .route-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .route-executable { max-width: 132px; padding: 5px 8px; border: 1px solid #475948; background: #121a14; color: var(--accent); font: 11px/1.35 sans-serif; overflow-wrap: anywhere; text-align: right; }
    .route-executable.is-blocked { border-color: #8a6a2b; background: #1a1610; color: #fc6; }
    .focus-route, .remove-route { width: 30px; height: 30px; flex: 0 0 30px; display: grid; place-items: center; cursor: pointer; min-height: 0; padding: 0; }
    .focus-route svg, .remove-route svg { display: block; }
    .focus-route { border: 1px solid #475948; background: #121a14; color: #d7f16a; }
    .remove-route { border: 1px solid #704044; background: #161013; color: #ff9d9d; }
    .route-mission-control > p { margin: 12px 0 0; color: #93a1a4; font: 11px/1.5 monospace; }
    .flight-controls h2, .flight-controls h3, .flight-controls p { margin-top: 0; }
     .flight-panel-tabs-shell { z-index: 2; background: var(--panel-strong); }
     .flight-panel-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
     .flight-panel-tab { min-height: 42px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
     .flight-panel-tab:last-child { border-right: 0; }
     .flight-panel-tab.active { background: #182126; color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
     .flight-panel-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
     .flight-panel-content { position: relative; min-height: 0; overflow: hidden; }
     .flight-panel-view {
       position: absolute;
       inset: 0;
       display: grid;
       grid-template-rows: auto auto minmax(0, 1fr);
       gap: 0;
       padding: 12px 16px 8px;
       overflow: hidden;
     }
     .flight-panel-view[data-flight-panel-view="mission"] { grid-template-rows: auto minmax(0, 1fr); }
     .flight-panel-view[data-flight-panel-view="mission"] .flight-now { margin-top: 0; }
     .flight-panel-view[hidden] { display: grid !important; visibility: hidden; pointer-events: none; }
     .flight-now {
       display: grid;
       margin: 10px 0 0;
       border-top: 1px solid var(--line);
     }
     .flight-now-row {
       display: grid;
       grid-template-columns: 5.5em minmax(0, 1fr);
       gap: 10px;
       align-items: center;
       height: 36px;
       border-bottom: 1px solid var(--line);
     }
     .flight-now-row span { color: var(--muted); font-size: 11px; }
     .flight-now-row strong {
       min-width: 0;
       color: var(--text);
       font: 11px/1.3 monospace;
       text-align: right;
       white-space: nowrap;
       overflow: hidden;
       text-overflow: ellipsis;
     }
     .flight-panel-actions { min-height: 0; margin-top: 12px; overflow: hidden; }
     .flight-controls button[data-action] { min-width: 8.5em; }
     .flight-controls button[data-action="mission-start"],
     .flight-controls button[data-action="stream-start"] { min-width: 9.6em; }
     .flight-controls button[data-arm="armed"] { border-color: #d8b456; color: #f3d58d; }
    .control-block { padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .control-block:last-of-type { border-bottom: 0; }
    .control-block-header { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .control-block-header h3 { margin-bottom: 4px; color: var(--text); font-size: 14px; font-weight: 600; }
    .control-block-header p { margin-bottom: 0; }
    .control-block-note { flex: 0 0 auto; margin: 1px 0 0; color: var(--muted); font: 10px/1.5 monospace; text-align: right; }
    .device-select-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 14px; }
    .device-select { display: grid; gap: 6px; color: var(--muted); font: 11px/1.4 monospace; }
    .flight-panel-phones { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .operation-state-panel { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .operation-state-panel h4 { margin: 0 0 5px; color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: 0; }
    .operation-state-panel > p { margin: 0; }
    .operation-state-list { display: grid; margin-top: 10px; border-top: 1px solid var(--line); }
    .operation-state-row { display: grid; grid-template-columns: minmax(132px, 1fr) minmax(0, 1fr); gap: 12px; align-items: baseline; min-height: 34px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .operation-state-row span { color: var(--muted); font-size: 11px; line-height: 1.45; }
    .operation-state-row small { display: block; margin-top: 2px; color: #66767a; font: 9px/1.35 monospace; overflow-wrap: anywhere; }
    .operation-state-row strong { min-width: 0; color: var(--text); font: 11px/1.45 monospace; overflow-wrap: anywhere; text-align: right; }
    .flight-controls select { width: 100%; min-width: 0; min-height: 36px; border: 1px solid #405057; background: #0a1013; color: var(--text); padding: 0 8px; font: 12px monospace; }
    .flight-controls select:focus-visible, .flight-controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .mission-status { margin: 14px 0 0; color: var(--text); font-size: 12px; line-height: 1.6; }
    .mission-route { margin: 6px 0 0; color: var(--muted); font: 11px/1.55 monospace; overflow-wrap: anywhere; }
    .mission-flow { display: grid; gap: 0; margin-top: 14px; border-top: 1px solid var(--line); }
    .mission-step { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .mission-step-copy { min-width: 0; display: grid; gap: 3px; }
    .mission-step-name { color: var(--text); font-size: 13px; font-weight: 600; }
    .mission-step-detail { color: var(--muted); font-size: 11px; line-height: 1.45; }
    .mission-step button { min-width: 116px; }
    .mission-step button:not(:disabled) { border-color: var(--accent); background: #1d2915; color: var(--accent); font-weight: 600; }
    .operation-feedback {
      min-height: 2.7em;
      max-height: 2.7em;
      margin: 7px 0 0;
      color: var(--muted);
      font: 10px/1.35 monospace;
      overflow: hidden;
    }
    .mission-secondary-actions, .stream-controls, .direct-flight-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .operation-action { min-width: 112px; flex: 1 1 112px; }
    .operation-action button { width: 100%; }
    .mission-secondary-actions button { min-width: 78px; }
    .mission-secondary-actions button[data-action="mission-stop"] { border-color: #704044; color: var(--danger); }
    .mission-confirmation, .flight-confirmation { margin-top: 12px; padding: 12px; border-left: 2px solid #d8b456; background: #1a1912; }
    .mission-confirmation p, .flight-confirmation p { margin-bottom: 10px; color: #f3d58d; font-size: 12px; line-height: 1.55; }
    .confirmation-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .mission-confirmation button:first-of-type, .flight-confirmation button:first-of-type { border-color: #d8b456; color: #f3d58d; }
    .stream-controls .row, .flight-safety-controls .row { margin: 10px 0 0; }
    .flight-safety-controls { margin-top: 14px; }
    .flight-safety-controls > p { margin: 0; }
    .direct-flight-actions { margin-top: 10px; }
    .direct-flight-actions button[data-action="flight-takeoff"] { border-color: #668661; }
    .direct-flight-actions button[data-action="flight-land"], .direct-flight-actions button[data-action="flight-return-home"] { border-color: #704044; color: var(--danger); }
    .direct-flight-actions button[data-action="flight-stop-takeoff"], .direct-flight-actions button[data-action="flight-stop-auto-landing"] { border-color: #d8b456; color: #f3d58d; }
    .operation-status {
      margin: 0;
      padding: 8px 16px;
      height: 40px;
      color: var(--muted);
      font-size: 12px;
      line-height: 24px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    @media (max-width: 860px) {
      body { overflow: auto; }
      #workspace-flight { display: block; overflow: visible; }
       #workspace-flight .flight-video { min-height: 420px; border-right: 0; border-bottom: 1px solid var(--line); }
       #workspace-flight .flight-controls { display: block; overflow: visible; }
       #workspace-flight .flight-panel-content { overflow: hidden; }
     }
    @media (max-width: 520px) {
      .connection-status-row { grid-template-columns: minmax(80px, 96px) minmax(0, 1fr); gap: 10px; }
      .device-select-grid { grid-template-columns: minmax(0, 1fr); }
      .mission-step { grid-template-columns: minmax(0, 1fr); gap: 9px; }
      .mission-step button { width: 100%; }
      .control-block-header { display: block; }
      .control-block-note { margin-top: 6px; text-align: left; }
      .operation-state-row { grid-template-columns: minmax(104px, 1fr) minmax(0, 1fr); gap: 8px; }
    }
  </style>
  <link rel="stylesheet" href="./cesium/Widgets/widgets.css" />
</head>
<body>
  <header>
    <h1>Sky Command</h1>
    <nav>
      <button data-workspace="devices">设备</button>
      <button data-workspace="routes">航线</button>
      <button data-workspace="flight">飞行</button>
    </nav>
    <span id="connection-count" class="muted">等待手机连接</span>
  </header>

  <main id="workspace-devices">
    <section>
      <h2>手机</h2>
      <div id="device-list"></div>
    </section>
    <section>
      <div class="section-heading">
        <h2>连接状态</h2>
        <div class="section-actions">
          <button id="device-refresh" type="button">刷新状态</button>
          <button id="device-link-measure" type="button">测量手机连接</button>
        </div>
      </div>
      <div id="device-detail" class="muted">从左侧选择已连接的手机。</div>
      <p id="device-guide" class="guide"></p>
    </section>
  </main>

  <main id="workspace-routes">
    <section class="route-preview-panel">
      <header>
        <div><span>航迹预览</span><h2>航迹文件预览</h2></div>
        <p id="route-summary">尚未导入航迹文件</p>
        <button id="route-import" type="button">导入 KML / KMZ</button>
      </header>
      <div id="map" class="cesium-host"></div>
      <p id="map-notice" class="notice">导入 Wayline 导出的 KML 或 KMZ 文件以预览航迹。</p>
    </section>
    <section class="route-mission-wrap">
      <div class="route-mission-control">
        <span class="eyebrow">当前航线</span>
        <label id="route-picker-wrap" class="route-picker" hidden>
          <span>选择航线</span>
          <select id="route-select"></select>
        </label>
        <div id="route-details" class="route-details" hidden>
          <div>
            <strong id="route-file-name"></strong>
            <small id="route-meta"></small>
          </div>
          <div class="route-actions">
            <span id="route-executable" class="route-executable"></span>
            <button id="route-locate" class="focus-route" type="button" title="定位到当前航线">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button id="route-remove" class="remove-route" type="button" title="删除">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
            </button>
          </div>
        </div>
        <p id="route-empty">导入 KML 或 KMZ 后，在这里选择待预览和发送的航线。</p>
      </div>
    </section>
  </main>

    <main id="workspace-flight">
     <section class="flight-video">
      <h2>图传画面</h2>
      <div class="flight-video-stage">
        <div id="flight-hud" class="flight-hud" aria-label="飞行现场">
          <span><small>飞/停</small><strong data-flight-hud="flying">—</strong></span>
          <span><small>电机</small><strong data-flight-hud="motors">—</strong></span>
          <span><small>电量</small><strong data-flight-hud="battery">—</strong></span>
          <span><small>高度</small><strong data-flight-hud="altitude">—</strong></span>
          <span><small>GPS</small><strong data-flight-hud="gps">—</strong></span>
          <span><small>模式</small><strong data-flight-hud="mode">—</strong></span>
        </div>
        <video id="video" controls muted autoplay playsinline></video>
        <p id="stream-label" class="notice"></p>
      </div>
     </section>
     <section class="flight-controls" aria-label="飞行操作">
       <div class="flight-panel-tabs-shell">
         <div class="flight-panel-tabs" role="tablist" aria-label="飞行操作分类">
           <button class="flight-panel-tab" type="button" role="tab" data-flight-panel="stream" aria-controls="flight-panel-stream">图传</button>
           <button class="flight-panel-tab" type="button" role="tab" data-flight-panel="mission" aria-controls="flight-panel-mission">航线</button>
           <button class="flight-panel-tab" type="button" role="tab" data-flight-panel="direct-flight" aria-controls="flight-panel-direct-flight">直接飞行</button>
         </div>
       </div>

       <div class="flight-panel-content">
         <div id="flight-panel-stream" class="flight-panel-view" data-flight-panel-view="stream" role="tabpanel">
          <div class="flight-panel-phones">
            <label class="device-select">
              <span>图传手机</span>
              <select id="stream-select"></select>
            </label>
            <label class="device-select">
              <span>任务手机</span>
              <select id="mission-select"></select>
            </label>
          </div>
          <div class="flight-now" aria-label="现在">
            <div class="flight-now-row"><span>链路</span><strong id="stream-ready" data-flight-status="stream-reach">—</strong></div>
            <div class="flight-now-row"><span>推流</span><strong data-flight-status="stream-push">—</strong></div>
            <div class="flight-now-row"><span>出画</span><strong data-flight-status="stream-paint">—</strong></div>
            <div class="flight-now-row"><span>运行错误</span><strong data-flight-status="stream-msdk-runtime-error">—</strong></div>
          </div>
          <div class="flight-panel-actions">
            <div class="row stream-controls">
              <div class="operation-action">
                <button data-action="stream-start">启动图传</button>
                <p class="operation-feedback" data-operation-feedback="stream-start" aria-live="polite"></p>
              </div>
              <div class="operation-action">
                <button data-action="stream-stop">停止图传</button>
                <p class="operation-feedback" data-operation-feedback="stream-stop" aria-live="polite"></p>
              </div>
            </div>
          </div>
         </div>

         <div id="flight-panel-mission" class="flight-panel-view" data-flight-panel-view="mission" role="tabpanel" hidden>
          <div class="flight-now" aria-label="现在">
            <div class="flight-now-row"><span>可达</span><strong data-flight-status="mission-reach">—</strong></div>
            <div class="flight-now-row"><span>执行</span><strong id="mission-label" data-flight-status="mission-execution-now">—</strong></div>
            <div class="flight-now-row"><span>上传/动作</span><strong data-flight-status="mission-upload-or-action">—</strong></div>
            <div class="flight-now-row"><span>中断</span><strong data-flight-status="mission-wayline-interrupt">—</strong></div>
          </div>
          <div class="flight-panel-actions">
            <div class="mission-flow">
              <div class="mission-step" data-mission-step="prepare">
                <div class="mission-step-copy">
                  <span class="mission-step-name">准备到手机</span>
                  <span class="mission-step-detail">仅传输到手机并校验文件</span>
                  <p class="operation-feedback" data-operation-feedback="mission-stage" aria-live="polite"></p>
                </div>
                <button data-action="mission-stage">准备航线</button>
              </div>
              <div class="mission-step" data-mission-step="upload">
                <div class="mission-step-copy">
                  <span class="mission-step-name">上传至飞机</span>
                  <span class="mission-step-detail">手机将已校验文件交给飞机</span>
                  <p class="operation-feedback" data-operation-feedback="mission-upload" aria-live="polite"></p>
                </div>
                <button data-action="mission-upload">上传至飞机</button>
              </div>
              <div class="mission-step" data-mission-step="execute">
                <div class="mission-step-copy">
                  <span class="mission-step-name">执行航线</span>
                  <span class="mission-step-detail">同一键再点确认</span>
                  <p class="operation-feedback" data-operation-feedback="mission-start" aria-live="polite"></p>
                </div>
                <button data-action="mission-start">执行航线</button>
              </div>
            </div>
            <div class="mission-secondary-actions" aria-label="航线进行中控制">
              <div class="operation-action">
                <button data-action="mission-pause">暂停</button>
                <p class="operation-feedback" data-operation-feedback="mission-pause" aria-live="polite"></p>
              </div>
              <div class="operation-action">
                <button data-action="mission-resume">恢复</button>
                <p class="operation-feedback" data-operation-feedback="mission-resume" aria-live="polite"></p>
              </div>
              <div class="operation-action">
                <button data-action="mission-stop">停止航线</button>
                <p class="operation-feedback" data-operation-feedback="mission-stop" aria-live="polite"></p>
              </div>
            </div>
          </div>
         </div>

         <div id="flight-panel-direct-flight" class="flight-panel-view" data-flight-panel-view="direct-flight" role="tabpanel" hidden>
          <label class="device-select">
            <span>直接飞行任务机</span>
            <select id="direct-flight-select"></select>
          </label>
          <div class="flight-now" aria-label="现在">
            <div class="flight-now-row"><span>可达</span><strong data-flight-status="direct-reach">—</strong></div>
            <div class="flight-now-row"><span>当前过程</span><strong id="landing-status" data-flight-status="direct-process">—</strong></div>
            <div class="flight-now-row"><span>降落保护</span><strong data-flight-status="direct-landing-protection">—</strong></div>
            <div class="flight-now-row"><span>确认降落</span><strong data-flight-status="direct-landing-confirmation">—</strong></div>
            <div class="flight-now-row"><span>低电量返航</span><strong data-flight-status="direct-low-battery-rth">—</strong></div>
            <div class="flight-now-row"><span>告警</span><strong data-flight-status="direct-alert">—</strong></div>
          </div>
          <div class="flight-panel-actions">
            <div class="direct-flight-actions">
              <div class="operation-action">
                <button data-action="flight-takeoff">起飞</button>
                <p class="operation-feedback" data-operation-feedback="flight-takeoff" aria-live="polite"></p>
              </div>
              <div class="operation-action">
                <button data-action="flight-land">降落</button>
                <p class="operation-feedback" data-operation-feedback="flight-land" aria-live="polite"></p>
              </div>
              <div class="operation-action">
                <button data-action="flight-confirm-landing">确认继续降落</button>
                <p class="operation-feedback" data-operation-feedback="flight-confirm-landing" aria-live="polite"></p>
              </div>
              <div class="operation-action">
                <button data-action="flight-return-home">返航</button>
                <p class="operation-feedback" data-operation-feedback="flight-return-home" aria-live="polite"></p>
              </div>
              <div class="operation-action">
                <button data-action="flight-stop-takeoff">停止自动起飞</button>
                <p class="operation-feedback" data-operation-feedback="flight-stop-takeoff" aria-live="polite"></p>
              </div>
              <div class="operation-action">
                <button data-action="flight-stop-auto-landing">停止自动降落</button>
                <p class="operation-feedback" data-operation-feedback="flight-stop-auto-landing" aria-live="polite"></p>
              </div>
            </div>
          </div>
         </div>
       </div>
       <p id="status" class="operation-status" aria-live="polite"></p>
    </section>
  </main>

  <script>window.CESIUM_BASE_URL = "./cesium/";</script>
  <script src="./cesium/Cesium.js"></script>
  <script src="./console.js"></script>
</body>
</html>
